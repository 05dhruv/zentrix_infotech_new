<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">ZFlow workflow dashboard</title><desc id="desc">A dark task-management dashboard with workflow columns and blue highlights.</desc>
